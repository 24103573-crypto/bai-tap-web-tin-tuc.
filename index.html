
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tin Tức Mỗi Ngày</title>

  <!-- Kết nối file CSS có sẵn -->
  <link rel="stylesheet" href="style.css">

  <!-- CSS bố cục bài viết -->
  <style>
    body {
      margin: 0;
      background: #f5f7fc;
      color: #172b4d;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    .site-header {
      padding: 22px 5%;
      background: #12346b;
      color: white;
    }

    .site-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .site-header p {
      margin: 4px 0 0;
      color: #dbeafe;
    }

    .page-container {
      width: min(1180px, 92%);
      margin: 28px auto;
    }

    .filterRow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .filterRow button {
      padding: 9px 15px;
      border: 1px solid #d6e2f5;
      border-radius: 22px;
      background: white;
      color: #12346b;
      cursor: pointer;
    }

    .filterRow button.active,
    .filterRow button:hover {
      background: #155eef;
      color: white;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 0 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e1e9f5;
    }

    .section-heading h2,
    .news-list-heading {
      margin: 0;
      color: #12346b;
    }

    .top-news-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
    }

    .featured-card,
    .top-small-card,
    .post-list-item {
      overflow: hidden;
      border: 1px solid #e3eaf5;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .featured-card:hover,
    .top-small-card:hover,
    .post-list-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px #12346b15;
    }

    .featured-image {
      display: block;
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #eaf2ff;
    }

    .featured-content {
      padding: 20px;
    }

    .featured-title {
      margin: 5px 0 12px;
      color: #12346b;
      font-size: 28px;
      line-height: 1.35;
    }

    .featured-summary,
    .post-list-summary {
      color: #667085;
    }

    .post-category {
      display: inline-block;
      color: #155eef;
      font-size: 13px;
      font-weight: bold;
    }

    .post-date {
      color: #7a869a;
      font-size: 12px;
    }

    .side-posts-area {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .top-small-card {
      display: grid;
      grid-template-columns: 135px minmax(0, 1fr);
      align-items: start;
      gap: 14px;
      padding: 12px;
    }

    .top-small-image {
      width: 135px;
      height: 115px;
      object-fit: cover;
      border-radius: 8px;
      background: #eaf2ff;
    }

    .top-small-title {
      margin: 5px 0;
      color: #12346b;
      font-size: 17px;
      line-height: 1.4;
    }

    .news-list-section {
      margin-top: 36px;
    }

    .news-list-heading {
      margin-bottom: 16px;
    }

    .post-list-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-list-link {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 20px;
      padding: 16px;
      color: inherit;
      text-decoration: none;
    }

    .post-list-image {
      width: 100%;
      height: 145px;
      object-fit: cover;
      border-radius: 8px;
      background: #eaf2ff;
    }

    .post-list-title {
      margin: 4px 0 8px;
      color: #12346b;
      font-size: 20px;
    }

    .post-list-summary {
      margin: 0 0 10px;
    }

    .image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: #667085;
      background: #eaf2ff;
      text-align: center;
    }

    .empty-message,
    .error-message {
      padding: 20px;
      border-radius: 10px;
      background: white;
      color: #667085;
    }

    .site-footer {
      margin-top: 45px;
      padding: 25px;
      background: #12346b;
      color: white;
      text-align: center;
    }

    @media (max-width: 850px) {
      .top-news-grid {
        grid-template-columns: 1fr;
      }

      .featured-image {
        height: 280px;
      }
    }

    @media (max-width: 600px) {
      .site-header h1 {
        font-size: 23px;
      }

      .featured-image {
        height: 220px;
      }

      .featured-title {
        font-size: 22px;
      }

      .top-small-card {
        grid-template-columns: 105px minmax(0, 1fr);
        gap: 10px;
      }

      .top-small-image {
        width: 105px;
        height: 90px;
      }

      .top-small-title {
        font-size: 15px;
      }

      .post-list-link {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .post-list-image {
        height: 190px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
  <div class="header-inner">
    <div>
      <h1>TIN TỨC MỖI NGÀY</h1>
      <p>Cập nhật tin tức mới nhất mỗi ngày</p>
    </div>

    <form id="searchForm" class="search-form" role="search">
      <input
        id="searchInput"
        type="search"
        placeholder="Tìm kiếm tin tức..."
        aria-label="Tìm kiếm tin tức"
      >
      <button type="submit">Tìm kiếm</button>
    </form>
  </div>
</header>

<nav class="nav-bar" aria-label="Danh mục tin tức">
  <div id="navMenu" class="nav-inner">
    <a href="./" class="nav-link active" data-home>Trang chủ</a>
  </div>
</nav>
  <main class="page-container">

    <!-- Các nút lọc chuyên mục -->
    <nav class="filterRow" aria-label="Lọc chuyên mục">
      <button type="button" data-category="Tất cả tin" class="active">
        Tất cả tin
      </button>
      <button type="button" data-category="Thế giới">
        Thế giới
      </button>
      <button type="button" data-category="Thời sự">
        Thời sự
      </button>
      <button type="button" data-category="Pháp luật">
        Pháp luật
      </button>
    </nav>

    <!-- Ba bài viết mới nhất -->
    <section class="news-top-section">
      <div class="section-heading">
        <h2 id="sectionTitle">Tin tức mới nhất</h2>
        <span id="postCount">Đang tải bài viết...</span>
      </div>

      <div class="top-news-grid">
        <div id="featuredPost" class="featured-post-area"></div>
        <div id="sidePosts" class="side-posts-area"></div>
      </div>
    </section>

    <!-- Các bài viết còn lại -->
    <section class="news-list-section">
      <h2 class="news-list-heading">Các tin tiếp theo</h2>
      <div id="postList" class="post-list-area">
        <p>Đang tải tin tức...</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p><strong>TIN TỨC MỖI NGÀY</strong></p>
    <p>Website thực hành HTML, CSS và JavaScript</p>
  </footer>

  <!-- Phải đặt main.js sau các khu vực HTML cần sử dụng -->
  <script src="main.js"></script>
</body>
</html>
